# Render Blueprint for the API (free web service; sleeps after 15 min idle, ~1 min to wake).
# The scheduled agents run on GitHub Actions, not here.
services:
  - type: web
    name: scout-api
    runtime: python
    plan: free
    region: singapore          # closest Render region to India
    buildCommand: pip install uv && uv sync --frozen --package scout-api
    startCommand: .venv/bin/uvicorn scout_api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: OWNER_EMAIL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
