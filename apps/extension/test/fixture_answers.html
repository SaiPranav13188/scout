<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>AI Engineer - Hyderabad | Acme</title></head>
<body>
<div class="location">Hyderabad, Telangana, India</div>
<form id="app" onsubmit="window.__submitted = true; return false">
  <div class="field"><label for="city">Current City</label><input id="city" type="text"></div>
  <div class="field"><label for="notice">Notice period</label><input id="notice" type="text"></div>
  <div class="field"><label for="cctc">Current CTC</label><input id="cctc" type="text"></div>
  <div class="field"><label for="ectc">Expected CTC</label><input id="ectc" type="text"></div>
  <div class="field"><label for="dob">Date of birth</label><input id="dob" type="date"></div>
  <div class="field"><label for="twelfth">12th percentage</label><input id="twelfth" type="text"></div>
  <div class="field"><label for="hear">How did you hear about us?</label>
    <select id="hear"><option value="">Select…</option><option>Referral</option><option>LinkedIn</option><option>Naukri</option></select></div>
  <fieldset><legend>Are you legally authorized to work in India?</legend>
    <label><input type="radio" name="auth_in" value="y"> Yes</label><label><input type="radio" name="auth_in" value="n"> No</label></fieldset>
  <fieldset><legend>Are you legally authorized to work in the United States?</legend>
    <label><input type="radio" name="auth_us" value="y"> Yes</label><label><input type="radio" name="auth_us" value="n"> No</label></fieldset>
  <fieldset><legend>Gender</legend>
    <label><input type="radio" name="gender" value="f"> Female</label><label><input type="radio" name="gender" value="m"> Male</label>
    <label><input type="radio" name="gender" value="x"> Prefer not to say</label></fieldset>
  <fieldset><legend>Do you have any active backlogs?</legend>
    <label><input type="radio" name="bl" value="none"> None of these</label><label><input type="radio" name="bl" value="no"> No</label>
    <label><input type="radio" name="bl" value="yes"> Yes</label></fieldset>
  <fieldset><legend>Are you willing to relocate?</legend>
    <label><input type="radio" name="rel" value="y"> Yes</label><label><input type="radio" name="rel" value="n"> No</label></fieldset>
  <div class="field"><label><input id="certify" type="checkbox"> I certify that the information above is true</label></div>
  <button type="submit">Submit</button>
</form>
</body></html>
