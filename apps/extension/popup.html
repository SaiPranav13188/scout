<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scout Autofill</title>
  <style>
    body { width: 290px; margin: 0; padding: 14px; font: 13px/1.45 system-ui, sans-serif; color: #111827; }
    h1 { font-size: 14px; margin: 0 0 6px; }
    p { margin: 6px 0; color: #4b5563; }
    button { width: 100%; padding: 8px; border: 0; border-radius: 8px; background: #4f46e5; color: #fff; font-weight: 600; cursor: pointer; }
    button:disabled { background: #9ca3af; cursor: default; }
    #status { min-height: 18px; }
    a { color: #4f46e5; }
    .warn { color: #b45309; }
  </style>
</head>
<body>
  <h1>Scout Autofill</h1>
  <p id="who">Loading your profile…</p>
  <button id="fill" type="button" disabled>Fill this page</button>
  <p id="status" role="status"></p>
  <p>Fills plain facts only and outlines them green. Questions that are your call stay empty (amber). It never presses Submit.</p>
  <p><a href="options.html" target="_blank">Profile and resume file</a></p>
  <script src="src/preset.js"></script>
  <script src="popup.js"></script>
</body>
</html>
