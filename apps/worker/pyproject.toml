[project]
name = "scout-worker"
version = "0.1.0"
description = "Scout Celery workers and scheduler"
requires-python = ">=3.12,<3.13"
dependencies = [
    "scout-core",
    "celery[redis]>=5.4",
    "redis>=5.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scout_worker"]
