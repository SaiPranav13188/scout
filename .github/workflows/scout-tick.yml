# Scout's scheduler (2026-11-14): one run stays up ~5.5 h, ticking every 10 minutes (Gmail alerts,
# company boards, scoring, instant alerts, digests) and answering Telegram in between.
# Render's free API, which used to be the 10-minute timer, was suspended for exceeding the shared
# monthly quota, and GitHub's own schedule fires only every few hours when busy, so the hourly trigger
# below just makes sure the next long run is already queued (concurrency group) when this one ends.
# Schedules come from the `settings` table, so changing them in the dashboard needs no edit here.
name: Scout tick
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: scout-tick
  cancel-in-progress: false   # a new trigger waits (queued) instead of stopping the running loop

permissions:
  contents: read

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 355   # GitHub's limit is 360
    env:
      ENV: production
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
      MONGO_URL: ${{ secrets.MONGO_URL }}
      ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
      # Match scoring (skips quietly until the GEMINI_API_KEY secret exists). Model names are config.
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      # Free tier: each model has its own daily request limit, so fall back across models.
      GEMINI_MODEL: gemini-3.5-flash-lite
      GEMINI_FALLBACK_MODELS: gemini-3.5-flash,gemini-3.8-flash
      GEMINI_EMBEDDING_MODEL: gemini-embedding-2
      # Langfuse tracing: off until these secrets exist.
      LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
      LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
      LANGFUSE_HOST: ${{ secrets.LANGFUSE_HOST || 'https://cloud.langfuse.com' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install uv (from PyPI, retried; GitHub release downloads gave 504s)
        run: for i in 1 2 3 4 5; do pipx install "uv==0.13.6" && break; sleep 15; done; uv --version
      # scout-api includes the worker; the loop reuses the API's Telegram command/button handler.
      - run: uv sync --frozen --package scout-api
      - run: uv run --package scout-api python -m scout_worker.cli loop 320
