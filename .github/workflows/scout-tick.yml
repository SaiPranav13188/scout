# Every ~10 minutes: check company job boards, send instant alerts, and run any due digest.
# Schedules come from the `settings` table, so changing them in the dashboard needs no edit here.
name: Scout tick
on:
  schedule:
    # Off the top of the hour, when GitHub's scheduler is busiest (runs can still be delayed).
    - cron: "4,14,24,34,44,54 * * * *"
  workflow_dispatch:

concurrency:
  group: scout-tick
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ENV: production
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
      MONGO_URL: ${{ secrets.MONGO_URL }}
      ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
      # Match scoring (skips quietly until the GEMINI_API_KEY secret exists). Model names are config.
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      # Free tier: each model has its own daily request limit, so fall back across models.
      GEMINI_MODEL: gemini-3.5-flash-lite
      GEMINI_FALLBACK_MODELS: gemini-3.5-flash,gemini-3.8-flash
      GEMINI_EMBEDDING_MODEL: gemini-embedding-2
      # Langfuse tracing: off until these secrets exist.
      LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
      LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
      LANGFUSE_HOST: ${{ secrets.LANGFUSE_HOST || 'https://cloud.langfuse.com' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install uv (from PyPI, retried; GitHub release downloads gave 504s)
        run: for i in 1 2 3 4 5; do pipx install "uv==0.13.6" && break; sleep 15; done; uv --version
      - run: uv sync --frozen --package scout-worker
      - run: uv run --package scout-worker python -m scout_worker.cli tick --skip discovery
