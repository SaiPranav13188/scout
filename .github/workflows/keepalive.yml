# GitHub disables scheduled workflows in public repos after 60 days without repository activity.
# A tiny monthly commit keeps the schedules alive.
name: Keepalive
on:
  schedule:
    - cron: "17 3 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/keepalive
          git config user.name "scout-keepalive"
          git config user.email "actions@users.noreply.github.com"
          git add .github/keepalive
          git commit -m "chore: keepalive" && git push
