[project]
name = "scout-core"
version = "0.1.0"
description = "Scout domain logic: sources, normalize, dedupe, filters, trust, verification, DB models"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "motor>=3.6",
    "rapidfuzz>=3.10",
    "selectolax>=0.3.21",
    "tldextract>=5.1",
    "cryptography>=43",
    "structlog>=24.4",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
browser = ["playwright>=1.48"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scout_core"]
